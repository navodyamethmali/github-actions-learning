name: Build and Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'sample-app/**'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      LOG_LEVEL: debug
    
    strategy:
      matrix:
        node-version: [16.x, 18.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print environment
        run: |
          echo "Environment: ${{ env.NODE_ENV }}"
          echo "Log Level: ${{ env.LOG_LEVEL }}"
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Install dependencies
        working-directory: ./sample-app
        run: npm install
      
      - name: Run linter
        working-directory: ./sample-app
        run: npm run lint
        continue-on-error: true
      
      - name: Build application
        working-directory: ./sample-app
        run: npm run build

      - name: Create artifact
        run: echo "Build output data from Node ${{ matrix.node-version }}" > output.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.node-version }}
          path: output.txt
      

  # 🎯 3. Add a new independent job that depends on the first one
  deploy-job:
    name: Process Artifact and Deploy
    runs-on: ubuntu-latest
    needs: [build-and-test] # Forces this job to wait until build-and-test completes successfully

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🎯 4. Download all version instances of the artifact matching the name pattern
      - name: Download Node 18 Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output-18.x
          path: downloaded-artifacts/

      # 🎯 5. Read the contents to verify successful cross-job communication
      - name: Verify Artifact Contents
        run: |
          echo "Reading downloaded artifact data..."
          cat downloaded-artifacts/output.txt
